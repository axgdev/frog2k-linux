# SF2000 Linux configuration schema. Copy this file to /sf2000.conf on the
# SD card to override defaults. Unknown keys are ignored for forward
# compatibility.
#
# boot_browser: bool {true,false}
boot_browser=true
# input_scan_ms: integer [2,20]; 4 is the performance-safe default.
input_scan_ms=4
# standby_poll_ms: integer [100,10000]
standby_poll_ms=2000
#
# language: enum {en,es,pt,pl,vi,ja}
language=en
# font: path; optional UTF-8 TrueType/OpenType font on the SD card.
font=/mnt/sd/sf2000/ui.ttf
# font_px: integer [10,24]
font_px=15
#
# Colors accept RGB565 (four hex digits) or RGB888 (six hex digits).
color.background=#0862
color.panel=#10c4
color.header=#ffffff
color.text=#e7efff
color.muted=#9299a8
color.accent=#32b7ff
color.selected_text=#000000
